<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Blueprint Not Found | Studio Draft</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0A0A0A;
            --red: #E63946;
            --gold: #C9A84C;
            --white: #FFFFFF;
            --white-muted: #B4B4B8;
            --mono: 'JetBrains Mono', monospace;
            --sans: 'Plus Jakarta Sans', sans-serif;
            --display: 'Syne', sans-serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--black);
            color: var(--white);
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(230, 57, 70, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .code {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--red);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
        }
        h1 {
            font-family: var(--display);
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }
        h1 span { color: var(--red); }
        p {
            color: var(--white-muted);
            font-size: 1.1rem;
            max-width: 520px;
            margin-bottom: 36px;
            line-height: 1.6;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--red);
            color: var(--white);
            padding: 14px 32px;
            border-radius: 100px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.4);
        }
    </style>
</head>
<body>
    <div class="code"><span class="dot"></span> ERROR 404 // ROUTE_UNRESOLVED</div>
    <h1>PAGE NOT <span>FOUND</span></h1>
    <p>The blueprint or page you are attempting to access does not exist or has been relocated within the system architecture.</p>
    <a href="index.html" class="btn">Return to Studio Draft →</a>
</body>
</html>
