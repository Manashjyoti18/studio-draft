<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- Top Announcement Bar -->
  <rect width="1200" height="36" fill="#111111"/>
  <text x="600" y="23" fill="#B7E4C7" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" class="font-mono">
    NOW ACCEPTING ONLINE RESERVATIONS &bull; ORGANIC BOTANICAL HAIR &amp; SCALP THERAPY
  </text>

  <!-- Main Navigation -->
  <rect y="36" width="1200" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="60" y="79" fill="#111111" font-size="22" font-weight="800" letter-spacing="2" class="font-sans">
    LUMEN SALON <tspan fill="#FF6B35">&amp;</tspan> SPA
  </text>
  <text x="740" y="78" fill="#111111" font-size="13" font-weight="600" letter-spacing="2" class="font-mono">
    SERVICES &bull; ARTISTS &bull; PRICING &bull; BOOK
  </text>
  <rect x="1000" y="52" width="140" height="38" fill="#111111"/>
  <text x="1070" y="76" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    BOOK CHAIR &rarr;
  </text>

  <!-- Hero Banner Section -->
  <rect x="60" y="140" width="1080" height="380" fill="#FAFAFA" stroke="#111111" stroke-width="2"/>
  
  <!-- Architectural Datum Line -->
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#111111" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="80" y="165" fill="#111111" font-size="11" font-weight="700" letter-spacing="2" class="font-mono">
    // SALON ARCHITECTURE &bull; BEAUTYBUSINESS.FREEDEV.APP DEMO
  </text>
  <text x="1120" y="165" fill="#FF6B35" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end" class="font-mono">
    [ APPOINTMENTS ACTIVE ]
  </text>

  <!-- Hero Typography -->
  <text x="80" y="270" fill="#111111" font-size="62" font-weight="900" letter-spacing="-1" class="font-sans">
    PRECISION CUTTING
  </text>
  <text x="80" y="340" fill="#111111" font-size="62" font-weight="900" letter-spacing="-1" class="font-sans">
    <tspan fill="#B7E4C7">&amp;</tspan> BOTANICAL COLOR.
  </text>
  <text x="80" y="390" fill="#555555" font-size="16" font-weight="400" class="font-sans">
    Tailored haircuts, ammonia-free dimensional color, and restorative holistic scalp treatments.
  </text>

  <!-- Hero Badges -->
  <rect x="80" y="430" width="190" height="46" fill="#FF6B35"/>
  <text x="175" y="458" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    RESERVE A STYLIST &rarr;
  </text>

  <rect x="285" y="430" width="180" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="375" y="458" fill="#111111" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    SERVICE CATALOGUE
  </text>

  <!-- Hero Graphic Element -->
  <rect x="740" y="200" width="360" height="280" fill="#111111"/>
  <rect x="755" y="215" width="330" height="250" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <circle cx="920" cy="305" r="42" fill="#B7E4C7"/>
  <circle cx="920" cy="305" r="32" fill="#111111"/>
  <text x="920" y="310" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" class="font-mono">
    COLOR LAB
  </text>
  <text x="920" y="390" fill="#111111" font-size="14" font-weight="800" text-anchor="middle" class="font-mono">
    BALAYAGE SPECIALTY
  </text>
  <text x="920" y="415" fill="#666666" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">
    NON-TOXIC &bull; AMMONIA FREE
  </text>

  <!-- Three Service Cards Below -->
  <g transform="translate(60, 545)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="200" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="25" y="38" fill="#FF6B35" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">// 01 STYLING</text>
    <text x="25" y="75" fill="#111111" font-size="20" font-weight="800" class="font-sans">Precision Haircuts</text>
    <text x="25" y="110" fill="#555555" font-size="13" class="font-sans">Custom architectural dry cuts shaped to your face geometry and hair texture.</text>
    <text x="25" y="165" fill="#111111" font-size="12" font-weight="700" class="font-mono">STARTING AT $85</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="200" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="395" y="38" fill="#111111" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">// 02 DIMENSION</text>
    <text x="395" y="75" fill="#111111" font-size="20" font-weight="800" class="font-sans">Hand-Painted Balayage</text>
    <text x="395" y="110" fill="#555555" font-size="13" class="font-sans">Seamless multi-tonal highlights that grow out gracefully with zero harsh lines.</text>
    <text x="395" y="165" fill="#111111" font-size="12" font-weight="700" class="font-mono">STARTING AT $220</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="200" fill="#111111"/>
    <text x="765" y="38" fill="#B7E4C7" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">// 03 SCALP HEALTH</text>
    <text x="765" y="75" fill="#FFFFFF" font-size="20" font-weight="800" class="font-sans">Botanical Scalp Spa</text>
    <text x="765" y="110" fill="#AAAAAA" font-size="13" class="font-sans">Deep cleansing scrub, steam infusion, and herbal nutrient massage therapy.</text>
    <text x="765" y="165" fill="#B7E4C7" font-size="12" font-weight="700" class="font-mono">60 MIN &bull; $110</text>
  </g>
</svg>