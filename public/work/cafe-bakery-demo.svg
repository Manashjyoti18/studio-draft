<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .font-serif { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="800" fill="#FFFFFF"/>

  <!-- Top Announcement Bar -->
  <rect width="1200" height="36" fill="#111111"/>
  <text x="600" y="23" fill="#FFFFFF" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle" class="font-mono">
    FRESH MORNING SOURDOUGH &bull; ROASTING SINGLE-ORIGIN ETHIOPIAN BEANS DAILY
  </text>

  <!-- Main Navigation -->
  <rect y="36" width="1200" height="70" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="60" y="79" fill="#111111" font-size="22" font-weight="800" letter-spacing="1" class="font-sans">
    ATELIER BAKERY <tspan fill="#FF6B35">&amp;</tspan> CAFE
  </text>
  <text x="750" y="78" fill="#111111" font-size="13" font-weight="600" letter-spacing="2" class="font-mono">
    MENU &bull; STORY &bull; HOURS &bull; LOCATION
  </text>
  <rect x="1030" y="52" width="110" height="38" fill="#FF6B35" stroke="#111111" stroke-width="2"/>
  <text x="1085" y="76" fill="#FFFFFF" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    ORDER NOW
  </text>

  <!-- Hero Banner Section -->
  <rect x="60" y="140" width="1080" height="380" fill="#F8F8F8" stroke="#111111" stroke-width="2"/>
  
  <!-- Architectural Datum Line -->
  <line x1="60" y1="180" x2="1140" y2="180" stroke="#111111" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="80" y="165" fill="#FF6B35" font-size="11" font-weight="700" letter-spacing="2" class="font-mono">
    // DAILY SPECIALTY ARCHITECTURE &bull; 42WEB.IO DEMO
  </text>
  <text x="1120" y="165" fill="#111111" font-size="11" font-weight="600" letter-spacing="1" text-anchor="end" class="font-mono">
    EST. 2026
  </text>

  <!-- Hero Typography -->
  <text x="80" y="270" fill="#111111" font-size="64" font-weight="900" letter-spacing="-1" class="font-sans">
    CRAFT SOURDOUGH
  </text>
  <text x="80" y="340" fill="#111111" font-size="64" font-weight="900" letter-spacing="-1" class="font-sans">
    <tspan fill="#FF6B35">&amp;</tspan> HONEST ROASTS.
  </text>
  <text x="80" y="390" fill="#555555" font-size="16" font-weight="400" class="font-sans">
    Slow-fermented artisanal breads, laminated viennoiserie, and seasonal single-origin espresso.
  </text>

  <!-- Hero Badges -->
  <rect x="80" y="430" width="160" height="46" fill="#111111"/>
  <text x="160" y="458" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    VIEW THE MENU &rarr;
  </text>

  <rect x="255" y="430" width="170" height="46" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="340" y="458" fill="#111111" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-mono">
    FIND OUR CAFE
  </text>

  <!-- Hero Image Graphic Representation (Right Column) -->
  <rect x="740" y="200" width="360" height="280" fill="#111111"/>
  <rect x="755" y="215" width="330" height="250" fill="#EAEAEA" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="920" cy="310" r="45" fill="#FF6B35"/>
  <circle cx="920" cy="310" r="38" fill="#111111"/>
  <text x="920" y="316" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" class="font-mono">
    HOT DRIP
  </text>
  <text x="920" y="390" fill="#111111" font-size="14" font-weight="800" text-anchor="middle" class="font-mono">
    BATCH BREW &bull; 08:00 AM
  </text>
  <text x="920" y="415" fill="#666666" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">
    COLOMBIA HUILA &bull; WASHED
  </text>

  <!-- Three Feature Cards Below -->
  <g transform="translate(60, 545)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="200" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="25" y="38" fill="#FF6B35" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">// 01 FERMENTATION</text>
    <text x="25" y="75" fill="#111111" font-size="20" font-weight="800" class="font-sans">36-Hour Wild Yeast</text>
    <text x="25" y="110" fill="#555555" font-size="13" class="font-sans">Naturally leavened using stoneground organic grains with zero industrial additives.</text>
    <text x="25" y="165" fill="#111111" font-size="12" font-weight="700" class="font-mono">LOAVES FROM $9.00</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="200" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="395" y="38" fill="#B7E4C7" font-size="11" font-weight="700" letter-spacing="1" class="font-mono" fill-opacity="1">
      <tspan fill="#111111" font-weight="900">// 02 VIENNOISERIE</tspan>
    </text>
    <text x="395" y="75" fill="#111111" font-size="20" font-weight="800" class="font-sans">French Butter Layers</text>
    <text x="395" y="110" fill="#555555" font-size="13" class="font-sans">Hand-laminated pain au chocolat, almond croissants, and seasonal fruit tarts.</text>
    <text x="395" y="165" fill="#111111" font-size="12" font-weight="700" class="font-mono">PASTRIES FROM $4.50</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="200" fill="#111111"/>
    <text x="765" y="38" fill="#B7E4C7" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">// 03 OPEN HOURS</text>
    <text x="765" y="75" fill="#FFFFFF" font-size="20" font-weight="800" class="font-sans">Tue – Sun: 7am – 4pm</text>
    <text x="765" y="110" fill="#AAAAAA" font-size="13" class="font-sans">Monday closed for dough conditioning and test baking. Walk-ins warmly welcomed.</text>
    <text x="765" y="165" fill="#FF6B35" font-size="12" font-weight="700" class="font-mono">MAP &amp; DIRECTIONS &rarr;</text>
  </g>
</svg>